name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Java
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.33 buildozer

    - name: Crear buildozer.spec limpio y configurado
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = SSC Huejotzingo
        package.name = sschuejotzingo
        package.domain = org.seguridad
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 1.0
        requirements = python3,kivy,requests,plyer,urllib3,certifi,idna,charset-normalizer
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,FOREGROUND_SERVICE
        android.api = 31
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Instalar herramientas de SDK y proveer sdkmanager
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf51fb78af6dfcbd139694ef" >> $SDK_DIR/licenses/android-sdk-license
        echo -e "\n24333f8a43b682e23c829b350621305a068eb477" >> $SDK_DIR/licenses/android-sdk-license

        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ || true
        
        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager

    - name: Compilar APK con Buildozer y capturar error
      run: |
        buildozer -v android debug || (echo "=== MOSTRANDO ÚLTIMAS LÍNEAS DEL ERROR ===" && exit 1)

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: app-android-debug
        path: bin/*.apk
