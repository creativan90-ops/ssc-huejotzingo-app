name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Java
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.33 buildozer

    - name: Inicializar buildozer.spec
      run: |
        buildozer init || true

    - name: Configurar buildozer.spec
      run: |
        sed -i 's/#(title)s/title = SSC Huejotzingo/g' buildozer.spec
        sed -i 's/#(package.name)s/package.name = sschuejotzingo/g' buildozer.spec
        sed -i 's/#(package.domain)s/package.domain = org.seguridad/g' buildozer.spec
        sed -i 's/#(requirements)s/requirements = python3,kivy,requests,plyer,urllib3,certifi,idna,charset-normalizer/g' buildozer.spec
        sed -i 's/#(android.permissions)s/android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION, FOREGROUND_SERVICE/g' buildozer.spec
        sed -i 's/#(orientation)s/orientation = portrait/g' buildozer.spec

    - name: Instalar y enlazar SDK Commandline Tools correctamente
      run: |
        ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
        # Crear la carpeta tools antigua y enlazar sdkmanager para que Buildozer lo detecte de inmediato
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.0" "platforms;android-33" "platform-tools"

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: app-android-debug
        path: bin/*.apk
