name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Java
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.33 buildozer

    - name: Inicializar buildozer.spec
      run: |
        buildozer init || true

    - name: Configurar buildozer.spec
      run: |
        sed -i 's/#(title)s/title = SSC Huejotzingo/g' buildozer.spec
        sed -i 's/#(package.name)s/package.name = sschuejotzingo/g' buildozer.spec
        sed -i 's/#(package.domain)s/package.domain = org.seguridad/g' buildozer.spec
        sed -i 's/#(requirements)s/requirements = python3,kivy,requests,plyer,urllib3,certifi,idna,charset-normalizer/g' buildozer.spec
        sed -i 's/#(android.permissions)s/android.permissions = INTERNET, ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION, FOREGROUND_SERVICE/g' buildozer.spec
        sed -i 's/#(orientation)s/orientation = portrait/g' buildozer.spec

    - name: Configurar Android SDK y licencias de forma manual
      run: |
        ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf51fb78af6dfcbd139694ef" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n24333f8a43b682e23c829b350621305a068eb477" >> $ANDROID_HOME/licenses/android-sdk-license

        # Descargar commandline-tools para asegurar sdkmanager
        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
        
        # Enlazar las herramientas para que Buildozer las reconozca de inmediato
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: app-android-debug
        path: bin/*.apk
